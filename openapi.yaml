    post:
      summary: Apply allow, warn, capture, or block policy before navigating to an HTTPS link.
      responses:
        "200": {description: Navigation decision}
  /outbound-links/events:
    get:
      summary: List captured outbound-link decisions for administrators.
      responses:
        "200": {description: Navigation event list}
  /directory/sync:
    post:
      summary: Synchronize a bounded LDAP or SCIM user/group batch into memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectorySyncInput"}
      responses:
        "200": {description: Directory synchronization result}
  /directory/ldap/sync:
    post:
      summary: Connect over certificate-verified LDAPS, query configured users/groups, map departments, and disable disappeared directory users.
      responses:
        "200": {description: LDAP query and synchronization result}
        "403": {description: LDAP synchronization is disabled}
        "503": {description: LDAPS connection, bind, or query failed}
  /ldap-auth/{workspaceId}:
    post:
      security: []
      summary: Authenticate with a service lookup and user LDAPS bind, then issue a short-lived workspace-bound Team Spaces session.
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LdapLoginInput"}
      responses:
        "201": {description: Short-lived LDAP session and synchronized member}
        "401": {description: Directory credentials were rejected}
  /scim/v2/Users:
    parameters:
      - {name: X-TeamSpaces-Account-Id, in: header, required: true, schema: {type: string}}
    get:
      summary: List SCIM 2.0 users using the workspace's hashed service credential.
      parameters:
        - {name: filter, in: query, schema: {type: string}}
        - {name: startIndex, in: query, schema: {type: integer, minimum: 1}}
        - {name: count, in: query, schema: {type: integer, minimum: 0, maximum: 100}}
      responses:
        "200": {description: SCIM ListResponse}
    post:
      summary: Provision a SCIM 2.0 user.
      responses:
        "201": {description: SCIM User}
  /scim/v2/Users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string}}
      - {name: X-TeamSpaces-Account-Id, in: header, required: true, schema: {type: string}}
    get:
      summary: Fetch a SCIM user.
      responses:
        "200": {description: SCIM User}
    put:
      summary: Replace a SCIM user.
      responses:
        "200": {description: SCIM User}
    patch:
      summary: Apply SCIM active, displayName, or role operations.
      responses:
        "200": {description: SCIM User}
    delete:
      summary: Disable a SCIM user.
      responses:
        "204": {description: User disabled}
  /scim/v2/Groups:
    parameters:
      - {name: X-TeamSpaces-Account-Id, in: header, required: true, schema: {type: string}}
    get:
      summary: List and filter SCIM 2.0 groups with current user membership.
      parameters:
        - {name: filter, in: query, schema: {type: string}}
        - {name: startIndex, in: query, schema: {type: integer, minimum: 1}}
        - {name: count, in: query, schema: {type: integer, minimum: 0, maximum: 100}}
      responses:
        "200": {description: SCIM ListResponse}
    post:
      summary: Provision a SCIM 2.0 group and synchronize up to 90 members.
      responses:
        "201": {description: SCIM Group}
  /scim/v2/Groups/{groupId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string}}
      - {name: X-TeamSpaces-Account-Id, in: header, required: true, schema: {type: string}}
    get:
      summary: Fetch a SCIM group with current membership.
      responses:
        "200": {description: SCIM Group}
    put:
      summary: Replace a SCIM group and its membership.
      responses:
        "200": {description: SCIM Group}
    patch:
      summary: Add, remove, or replace SCIM group attributes and members.
      responses:
        "200": {description: SCIM Group}
    delete:
      summary: Delete a SCIM group and remove it from every member.
      responses:
        "204": {description: Group deleted}
  /webhooks/{webhookId}/deliver:
    post:
      summary: Deliver a configured HTTPS webhook event and persist its outcome.
