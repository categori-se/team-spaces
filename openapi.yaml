        "200": {description: JSON-RPC response}
        "403": {description: MCP is disabled or the requested tool is not authorized}
  /integrations:
    get:
      summary: Return maintained connector, repository, and link status for GitHub, GitLab, Nextcloud, OneDrive, SharePoint, XWiki, openDesk, Jira, Git, SVN, and generic providers.
      responses:
        "200": {description: Integration catalog}
  /integration-links:
    get:
      summary: List external development and file links, optionally by project, task, or connector.
      responses:
        "200": {description: Integration link list}
    post:
      summary: Link an external development, storage, or collaboration record to a project or task.
      responses:
        "201":
          description: Created link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntegrationLink"}
  /integration-links/{linkId}:
    delete:
      summary: Remove an integration link with optimistic concurrency.
      parameters:
        - {name: linkId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Deletion result}
  /integrations/{connectorId}/events:
    post:
      summary: Ingest a maintained connector event and attach it to the matching linked task.
      parameters:
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: Integration event}
  /integrations/{connectorId}/health:
    post:
      summary: Authenticate to the configured provider and run its bounded health check.
      parameters:
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Authenticated provider health result}
        "400": {description: Adapter is unsupported or incomplete}
        "503": {description: Provider authentication or request failed}
  /integrations/{connectorId}/resources:
    get:
      summary: Browse provider-side pull requests, merge requests, files, folders, or wiki pages.
      parameters:
        - {name: connectorId, in: path, required: true, schema: {type: string}}
        - {name: path, in: query, schema: {type: string, maxLength: 1000}}
        - {name: query, in: query, schema: {type: string, maxLength: 240}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 500}}
      responses:
        "200":
          description: Bounded provider resource page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ProviderResource"}}
                  nextCursor: {type: string}
    post:
      summary: Create an XWiki page and link it to a project or task.
      parameters:
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationResourceInput"}
      responses:
        "201": {description: Created provider resource and Team Spaces link}
  /integrations/{connectorId}/permissions/sync:
    post:
      summary: Reconcile active project membership with explicitly managed provider folder permissions.
      parameters:
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntegrationPermissionSyncInput"}
      responses:
        "200": {description: Added and removed provider principals}
  /provider-webhooks/{workspaceId}/{connectorId}:
    post:
      security: []
      summary: Receive a replay-protected GitHub, GitLab, XWiki, Nextcloud, or openDesk event after provider signature verification.
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string}}
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Accepted, normalized, linked, and recorded provider event}
        "401": {description: Webhook signature or shared token is invalid}
  /provider-api/{workspaceId}/{connectorId}/work-items:
    get:
      security: []
      summary: Let an authenticated XWiki, Nextcloud, or openDesk adapter search a bounded project work-item set.
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string}}
        - {name: connectorId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: query, required: true, schema: {type: string}}
        - {name: query, in: query, schema: {type: string, maxLength: 240}}
      responses:
        "200": {description: At most 100 matching work items}
        "401": {description: External provider credential is invalid}
    post:
      security: []
      summary: Let an authenticated XWiki, Nextcloud, or openDesk adapter create a work item in an explicitly allowed project.
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {type: string}}
        - {name: connectorId, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: Created work item}
        "401": {description: External provider credential is invalid}
  /integrations/jira/import:
    post:
      summary: Import a bounded Jira issue batch into configured Team Spaces work types and statuses.
      responses:
        "201": {description: Imported work items, links, and per-record results}
  /repositories:
    get:
      summary: List configured on-premises Git and SVN repository mirrors.
      responses:
        "200": {description: Repository list}
  /repositories/{repositoryId}/tree:
    get:
      summary: Browse a synchronized Git or SVN tree by path and ref without exposing repository credentials.
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string}}
        - {name: path, in: query, schema: {type: string, maxLength: 1000}}
        - {name: ref, in: query, schema: {type: string}}
      responses:
        "200": {description: Repository tree}
  /repositories/{repositoryId}/sync:
    post:
      summary: Replace the bounded mirrored tree snapshot for a configured Git or SVN repository.
      parameters:
        - {name: repositoryId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Repository snapshot metadata}
  /external-shares:
    get:
      summary: List task shares created for external users, emails, or groups.
      responses:
        "200": {description: External share list}
    post:
      summary: Create a recipient-limited, expiring task share with read or comment permission.
      responses:
        "201":
          description: External share
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExternalShare"}
  /external-shares/{token}:
    delete:
      summary: Revoke an external task share.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Revocation result}
  /shared-work/{token}:
    get:
      summary: Return a task and external-safe conversation only when the authenticated identity matches the share recipient.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Shared task}
        "404": {description: Share is absent, expired, revoked, or belongs to another recipient}
  /shared-work/{token}/comments:
    post:
      summary: Add an external-visible comment when the share grants comment permission.
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "201": {description: External comment}
