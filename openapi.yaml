        "200": {description: Updated planning resource}
    delete:
      summary: Delete a planning resource with optimistic concurrency.
      responses:
        "200": {description: Deletion result}
  /planning-resources/{resourceId}/baseline-comparison:
    get:
      summary: Compare current project work with the selected immutable baseline.
