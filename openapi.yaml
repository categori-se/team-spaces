  /project-content/{contentId}/presence:
    parameters:
      - {name: contentId, in: path, required: true, schema: {type: string}}
    get:
      summary: List active editor cursors with a two-minute lease.
      responses:
        "200": {description: Active editor list}
    post:
      summary: Refresh the current editor's cursor and selection lease.
      responses:
        "200": {description: Editor presence}
  /documents/{documentId}/scan:
    post:
      summary: Record scanner verdict and bounded extracted text before quarantine promotion.
      parameters:
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Scanned document metadata}
  /documents/{documentId}/scan-request:
    post:
      summary: Verify an uploaded quarantined object, persist queued state, and dispatch a short-lived scanner job through the configured webhook.
      parameters:
        - {name: documentId, in: path, required: true, schema: {type: string}}
        - {name: projectId, in: query, required: true, schema: {type: string}}
      responses:
        "202": {description: Scanner job and public pending-document state}
  /reports/costs:
    get:
      summary: Run the full or a reusable configured rate, unit-cost, budget, and variance report.
      parameters:
        - {name: definitionId, in: query, schema: {type: string}}
      responses:
        "200": {description: Cost and budget report}
  /reports/resources:
    get:
      summary: Return a dated weekly resource plan with skills, time off, net capacity, project allocation, task effort, availability, and over-allocation.
      parameters:
        - {name: week, in: query, schema: {type: string, format: date}}
        - {name: projectId, in: query, schema: {type: string}}
        - {name: skill, in: query, schema: {type: string, maxLength: 100}}
      responses:
        "200": {description: Resource capacity plan}
  /resource-planner/profiles:
    post:
      summary: Create or replace a member's versioned weekly capacity and skills profile.
      responses:
        "200": {description: Updated workspace capabilities}
  /resource-planner/allocations:
    post:
      summary: Create or replace a dated project staffing allocation.
      responses:
        "200": {description: Updated workspace capabilities}
  /resource-planner/allocations/{allocationId}:
    delete:
      summary: Delete a project staffing allocation using the capability version.
      parameters:
        - {name: allocationId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Updated workspace capabilities}
  /resource-planner/time-off:
    post:
      summary: Create or replace dated member time off that reduces net capacity.
      responses:
        "200": {description: Updated workspace capabilities}
  /resource-planner/time-off/{timeOffId}:
    delete:
      summary: Delete time off using the capability version.
      parameters:
        - {name: timeOffId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Updated workspace capabilities}
  /security/badge:
    get:
      summary: Return the installation's MFA, alerting, scan, quarantine, outbound-link, and SCIM security checks.
      responses:
        "200": {description: Installation security badge}
