name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:infra
      - run: npm run audit:licenses
      - run: npm run audit:vulns
      - run: npm run scan:secrets
      - name: Record build identity
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: >-
          node -e "const fs=require('node:fs');
          fs.writeFileSync('apps/web/dist/release-manifest.json',
          JSON.stringify({repository:process.env.RELEASE_REPOSITORY,
          commit_sha:process.env.RELEASE_SHA,workflow_run_id:process.env.RELEASE_RUN_ID},null,2)+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teamspaces-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
